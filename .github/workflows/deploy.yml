name: Deploy to cPanel
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin main
            git reset --hard origin/main
            composer install --no-dev --optimize-autoloader
            php artisan optimize:clear
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan queue:restart
            ln -sfn ${{ secrets.DEPLOY_PATH }}/storage/app/public ~/public_html/storage
            cp -r ${{ secrets.DEPLOY_PATH }}/public/css/. ~/public_html/css/
            cp -r ${{ secrets.DEPLOY_PATH }}/public/js/. ~/public_html/js/
            cp ${{ secrets.DEPLOY_PATH }}/public/favicon.ico ~/public_html/favicon.ico
